services:
  proxy:
    image: nginx:stable-alpine
    ports:
      - target: 80
        published: 19080
        protocol: tcp
        mode: ingress
    configs:
      - source: proxy_nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback

  app:
    image: guess-app:latest
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback

  db:
    image: guess-db:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guessuser -d guessdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

configs:
  proxy_nginx_conf:
    file: ./proxy/nginx.conf

volumes:
  postgres_data:

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
    internal: true
