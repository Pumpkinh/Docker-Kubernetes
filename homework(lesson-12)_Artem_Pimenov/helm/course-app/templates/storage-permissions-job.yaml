{{- if and .Values.storage.enabled .Values.cnpg.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "course-app.fullname" . }}-storage-permissions
  labels:
    {{- include "course-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-permissions
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "course-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: storage-permissions
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: {{ required "storage.nodeName is required when storage.enabled=true" .Values.storage.nodeName | quote }}
      containers:
        - name: chown-data
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /data
              chown -R 26:26 /data
              chmod 700 /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: {{ required "storage.hostPath is required when storage.enabled=true" .Values.storage.hostPath | quote }}
            type: DirectoryOrCreate
{{- end }}
