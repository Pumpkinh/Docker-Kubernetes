replicaCount: 10

image:
  repository: pimenov2unit/course-app
  tag: lesson-12
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  host: course-app.local
  path: /
  pathType: Prefix

config:
  appBanner: "Lesson 12: CloudNativePG operator and RBAC"
  appVersion: "lesson-12"

secret:
  flaskSecretKey: super-secret-key

postgres:
  host: ""
  port: "5432"
  database: guessdb
  user: guessuser
  password: guesspass123

storage:
  enabled: false
  className: local-storage
  size: 1Gi
  hostPath: /var/lib/course-app/helm-postgresql-data
  nodeName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  path: /ready
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

strategy:
  maxSurge: 1
  maxUnavailable: 0

cnpg:
  enabled: true
  clusterName: ""
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 1Gi
    storageClass: ""

rbac:
  dbViewer:
    enabled: true
    serviceAccountName: db-viewer
    roleName: db-readonly
