apiVersion: v1
kind: Secret
metadata:
  name: course-app-postgresql-credentials
type: kubernetes.io/basic-auth
stringData:
  username: guessuser
  password: guesspass123
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: course-app-postgresql
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: guessdb
      owner: guessuser
      secret:
        name: course-app-postgresql-credentials
      postInitApplicationSQL:
        - |
          CREATE TABLE IF NOT EXISTS game_results (
              id SERIAL PRIMARY KEY,
              player_id VARCHAR(64) NOT NULL,
              attempts INTEGER NOT NULL,
              played_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          ALTER TABLE game_results OWNER TO guessuser;
          ALTER SEQUENCE game_results_id_seq OWNER TO guessuser;
